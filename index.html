<!doctype html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Rondes</title>
<meta name="description" content="Quadern de rondes — anota qui beu què" />
<meta name="theme-color" content="#1E1712" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E1712;
    --surface:#2A211A;
    --surface-2:#332821;
    --ink:#EDE6D6;
    --ink-muted:#B9AD98;
    --amber:#D9A441;
    --amber-dark:#C08F34;
    --danger:#B5533C;
    --ok:#7A9471;
    --line: rgba(237,230,214,0.10);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces','Georgia',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  #app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .hidden{display:none !important;}

  /* ---------- Auth screen ---------- */
  #auth-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 28px;
    text-align:center;
    gap:22px;
  }
  #auth-screen .mark{
    width:64px;height:64px;
    border-radius:16px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
  }
  #auth-screen h1{font-size:32px;margin:0;color:var(--ink);}
  #auth-screen p{color:var(--ink-muted);margin:0;font-size:15px;line-height:1.5;max-width:32ch;}
  .btn-google{
    display:flex;align-items:center;gap:10px;
    background:var(--ink);
    color:#1E1712;
    border:none;
    padding:13px 22px;
    border-radius:999px;
    font-family:'Inter';font-weight:600;font-size:15px;
    cursor:pointer;
  }
  .btn-google:active{transform:scale(0.98);}
  #auth-error{color:var(--danger); font-size:13px; max-width:32ch;}

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{display:flex;flex-direction:column;}
  header.top .brand h1{font-size:22px;margin:0;color:var(--ink);}
  header.top .brand span{font-size:12px;color:var(--ink-muted);}
  .user-chip{display:flex;align-items:center;gap:8px;}
  .user-chip img{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--amber);}
  .user-chip button{
    background:none;border:none;color:var(--ink-muted);
    font-size:12px;text-decoration:underline;cursor:pointer;padding:0;
    font-family:'Inter';
  }

  main{flex:1; padding:18px 16px 100px;}

  .section-title{
    font-size:13px;
    color:var(--ink-muted);
    margin:22px 4px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title:first-child{margin-top:4px;}

  /* ---------- Drink cards ---------- */
  .drink-card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px 14px;
    margin-bottom:10px;
    border:1px solid var(--line);
  }
  .drink-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .drink-name{font-family:'Fraunces';font-size:18px;font-weight:600;color:var(--ink);}
  .drink-meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .icon-btn{
    background:none;border:none;color:var(--ink-muted);
    font-size:16px;cursor:pointer;padding:4px 6px;line-height:1;
  }
  .icon-btn.danger{color:var(--danger);}
  .drink-card-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:10px;
  }
  .stepper{
    display:flex;align-items:center;gap:0;
    background:var(--surface-2);
    border-radius:999px;
    padding:4px;
  }
  .stepper button{
    width:32px;height:32px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:var(--ink);
    font-size:18px;
    cursor:pointer;
  }
  .stepper button:active{background:var(--line);}
  .stepper .qty{
    width:30px;text-align:center;
    font-weight:600;font-size:15px;
  }
  .btn-record{
    background:var(--amber);
    color:#1E1712;
    border:none;
    padding:9px 18px;
    border-radius:999px;
    font-family:'Inter';font-weight:700;font-size:14px;
    cursor:pointer;
    flex:1;
    max-width:130px;
  }
  .btn-record:active{background:var(--amber-dark);}

  /* ---------- Add drink form (admin) ---------- */
  .add-drink-card{
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .add-drink-card form{display:flex; gap:8px;}
  .add-drink-card input[type=text]{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    font-family:'Inter';font-size:14px;
  }
  .add-drink-card input[type=text]::placeholder{color:var(--ink-muted);}
  .add-drink-card button{
    background:var(--ink);
    color:#1E1712;
    border:none;
    border-radius:10px;
    padding:0 16px;
    font-weight:700;
    cursor:pointer;
  }

  .empty-state{
    color:var(--ink-muted);
    font-size:14px;
    text-align:center;
    padding:30px 10px;
    line-height:1.6;
  }

  /* ---------- Activity feed ---------- */
  .activity-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    gap:10px;
  }
  .activity-item:last-child{border-bottom:none;}
  .activity-text b{color:var(--ink); font-weight:600;}
  .activity-text{color:var(--ink-muted); line-height:1.4;}
  .activity-time{color:var(--ink-muted); font-size:11.5px; white-space:nowrap;}
  .activity-row{display:flex; align-items:center; gap:8px;}

  /* ---------- Role banner ---------- */
  .banner{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    color:var(--ink-muted);
    margin-bottom:16px;
    line-height:1.5;
  }
  .banner code{
    background:rgba(237,230,214,0.08);
    padding:1px 5px;
    border-radius:4px;
    font-size:12px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#1E1712;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
</style>
</head>
<body>

<div id="app-shell">

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="mark">🍺</div>
    <h1>Rondes</h1>
    <p>El quadern de rondes. Entra amb Google per anotar begudes i veure el recompte.</p>
    <button class="btn-google" id="google-signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.9c1.7-1.57 2.7-3.88 2.7-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continuar amb Google
    </button>
    <div id="auth-error"></div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">
        <h1>Rondes</h1>
        <span id="role-label"></span>
      </div>
      <div class="user-chip">
        <img id="user-photo" src="" alt="" />
        <button id="signout-btn">Sortir</button>
      </div>
    </header>

    <main>
      <div id="admin-bootstrap-banner" class="banner hidden">
        Ets un usuari nou. Si has de ser l'administrador, obre la Consola de Firebase → Firestore →
        col·lecció <code>users</code> → el teu document → canvia <code>role</code> a <code>admin</code>, i recarrega.
      </div>

      <div class="section-title">Begudes</div>
      <div id="drinks-list"></div>

      <div id="add-drink-wrap" class="hidden">
        <div class="add-drink-card">
          <form id="add-drink-form">
            <input type="text" id="new-drink-name" placeholder="Nom de la beguda nova" maxlength="40" required />
            <button type="submit">Afegir</button>
          </form>
        </div>
      </div>

      <div class="section-title">Últimes rondes</div>
      <div id="activity-list"></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, orderBy, limit, onSnapshot, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyACokQjOdFy0xuzfAs-ycS9hJMpXvBVml8",
  authDomain: "canyeta-ab120.firebaseapp.com",
  projectId: "canyeta-ab120",
  storageBucket: "canyeta-ab120.firebasestorage.app",
  messagingSenderId: "770281395731",
  appId: "1:770281395731:web:149380a4ce5d3d1009d1e6",
  measurementId: "G-LC004PB9SC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let currentRole = 'user';
let drinkTypes = [];   // [{id, name, totalCount}]
let entries = [];      // recent entries, desc by time
let qtyState = {};     // drinkTypeId -> current stepper qty

// ---------- Auth ----------
document.getElementById('google-signin-btn').addEventListener('click', async () => {
  document.getElementById('auth-error').textContent = '';
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    document.getElementById('auth-error').textContent = 'No s\'ha pogut iniciar sessió. Torna-ho a provar.';
    console.error(e);
  }
});

document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    currentUser = null;
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  currentUser = user;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-photo').src = user.photoURL || '';
  await ensureUserDoc(user);
  listenDrinkTypes();
  listenEntries();
});

async function ensureUserDoc(user) {
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      name: user.displayName || '',
      email: user.email || '',
      photoURL: user.photoURL || '',
      role: 'user',
      createdAt: serverTimestamp()
    });
    currentRole = 'user';
    document.getElementById('admin-bootstrap-banner').classList.remove('hidden');
  } else {
    currentRole = snap.data().role || 'user';
    document.getElementById('admin-bootstrap-banner').classList.toggle('hidden', currentRole === 'admin');
  }
  document.getElementById('role-label').textContent =
    currentRole === 'admin' ? 'Administrador' : (user.displayName || '');
  document.getElementById('add-drink-wrap').classList.toggle('hidden', currentRole !== 'admin');
}

// ---------- Drink types ----------
function listenDrinkTypes() {
  const q = query(collection(db, 'drinkTypes'), orderBy('createdAt', 'asc'));
  onSnapshot(q, (snap) => {
    drinkTypes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderDrinks();
  });
}

document.getElementById('add-drink-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('new-drink-name');
  const name = input.value.trim();
  if (!name) return;
  try {
    await addDoc(collection(db, 'drinkTypes'), {
      name,
      totalCount: 0,
      createdAt: serverTimestamp(),
      createdBy: currentUser.uid
    });
    input.value = '';
    showToast(`"${name}" afegida`);
  } catch (err) {
    console.error(err);
    showToast('No s\'ha pogut afegir');
  }
});

async function deleteDrinkType(id, name) {
  if (!confirm(`Esborrar "${name}"? No s'esborrarà l'historial ja anotat.`)) return;
  try {
    await deleteDoc(doc(db, 'drinkTypes', id));
    showToast('Beguda esborrada');
  } catch (err) {
    console.error(err);
    showToast('No s\'ha pogut esborrar');
  }
}

function renderDrinks() {
  const list = document.getElementById('drinks-list');
  if (drinkTypes.length === 0) {
    list.innerHTML = `<div class="empty-state">${
      currentRole === 'admin'
        ? 'Encara no hi ha begudes. Afegeix-ne una a sota per començar.'
        : 'Encara no hi ha begudes. Demana a un administrador que n\'afegeixi.'
    }</div>`;
    return;
  }
  list.innerHTML = '';
  drinkTypes.forEach(dt => {
    if (!(dt.id in qtyState)) qtyState[dt.id] = 1;
    const todayCount = entries
      .filter(e => e.drinkTypeId === dt.id && isToday(e.createdAt))
      .reduce((s, e) => s + (e.quantity || 0), 0);

    const card = document.createElement('div');
    card.className = 'drink-card';
    card.innerHTML = `
      <div class="drink-card-top">
        <div>
          <div class="drink-name">${escapeHtml(dt.name)}</div>
          <div class="drink-meta">Avui: ${todayCount} · Total: ${dt.totalCount || 0}</div>
        </div>
        ${currentRole === 'admin' ? `<button class="icon-btn danger" data-del="${dt.id}" data-name="${escapeHtml(dt.name)}">✕</button>` : ''}
      </div>
      <div class="drink-card-controls">
        <div class="stepper">
          <button data-step="-1" data-id="${dt.id}">−</button>
          <span class="qty" id="qty-${dt.id}">${qtyState[dt.id]}</span>
          <button data-step="1" data-id="${dt.id}">+</button>
        </div>
        <button class="btn-record" data-record="${dt.id}">Anotar</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('[data-step]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const delta = parseInt(btn.dataset.step, 10);
      qtyState[id] = Math.max(1, (qtyState[id] || 1) + delta);
      document.getElementById(`qty-${id}`).textContent = qtyState[id];
    });
  });
  list.querySelectorAll('[data-record]').forEach(btn => {
    btn.addEventListener('click', () => recordEntry(btn.dataset.record));
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => deleteDrinkType(btn.dataset.del, btn.dataset.name));
  });
}

async function recordEntry(drinkTypeId) {
  const dt = drinkTypes.find(d => d.id === drinkTypeId);
  if (!dt) return;
  const qty = qtyState[drinkTypeId] || 1;
  try {
    await addDoc(collection(db, 'entries'), {
      drinkTypeId,
      drinkTypeName: dt.name,
      quantity: qty,
      userId: currentUser.uid,
      userName: currentUser.displayName || 'Algú',
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'drinkTypes', drinkTypeId), {
      totalCount: increment(qty)
    });
    qtyState[drinkTypeId] = 1;
    showToast(`Anotat: ${qty} × ${dt.name}`);
  } catch (err) {
    console.error(err);
    showToast('No s\'ha pogut anotar');
  }
}

// ---------- Activity feed ----------
function listenEntries() {
  const q = query(collection(db, 'entries'), orderBy('createdAt', 'desc'), limit(100));
  onSnapshot(q, (snap) => {
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderDrinks();
    renderActivity();
  });
}

function renderActivity() {
  const list = document.getElementById('activity-list');
  if (entries.length === 0) {
    list.innerHTML = `<div class="empty-state">Encara no s'ha anotat cap ronda.</div>`;
    return;
  }
  list.innerHTML = '';
  entries.slice(0, 20).forEach(e => {
    const row = document.createElement('div');
    row.className = 'activity-item';
    row.innerHTML = `
      <div class="activity-row">
        <div class="activity-text"><b>${escapeHtml(e.userName || 'Algú')}</b> — ${e.quantity} × ${escapeHtml(e.drinkTypeName || '')}</div>
      </div>
      <div class="activity-row">
        <span class="activity-time">${formatTime(e.createdAt)}</span>
        ${currentRole === 'admin' ? `<button class="icon-btn danger" data-del-entry="${e.id}">✕</button>` : ''}
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-del-entry]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Esborrar aquesta anotació?')) return;
      try {
        await deleteDoc(doc(db, 'entries', btn.dataset.delEntry));
        showToast('Anotació esborrada');
      } catch (err) {
        console.error(err);
        showToast('No s\'ha pogut esborrar');
      }
    });
  });
}

// ---------- Helpers ----------
function isToday(ts) {
  if (!ts) return false;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() &&
         d.getMonth() === now.getMonth() &&
         d.getDate() === now.getDate();
}
function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return 'ara mateix';
  if (diffMin < 60) return `fa ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `fa ${diffH} h`;
  return d.toLocaleDateString('ca-ES', { day: 'numeric', month: 'short' });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Service worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
